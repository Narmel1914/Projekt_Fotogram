<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

</head>

<body>

        <div class="content_header">
            <div class="logo_und_titel">
                <div id="logo">

                <div id="logo_titel">
                    <h3>Fotogram</h3>
                </div>
            </div>

        </div>

    </header>
    <main>
        <section class="main_task">

                    <div id="galerie_photo"> </div>
                </div>
        </section>
    </main>

            <div id="logo">
                <img src="Icons/DA.png" alt="DA_Logo">

        </div>
