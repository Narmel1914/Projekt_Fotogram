<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projekt-Fotogram</title>
</head>

<body onload="init()">
    <header>
        <div class="content_header">
            <div class="logo_und_titel">
                <div id="logo">
                    <img src="Icons/Group.png" alt="fotogram_Logo">
                </div>
                <div id="logo_titel">
                    <h3>Fotogram</h3>
                </div>
            </div>

        </div>

    </header>
    <main>
        <section class="main_task">
            <div class="content_wrapper">
                <div class="dialog_titel">
                    <h1>Your Personal Photo album</h1>
                </div>
                <div class="dialog_photo">
                    <div class="galerie_photo" id="galerie_photo"> </div>
                    <dialog id="dialog_wrapper">
                        <div class="dialog_content">
                            <div id="single_dialog_titel">
                                <p id="name_img"></p>
                            </div>
                            <div id="single_dialog_img">
                                <img id="big_img" src="" alt="">
                            </div>
                            <div class="dialog_nav">
                                <button id="btn_prev">&larr;</button>
                                <button id="btn_next">&rarr;</button>
                            </div>
                        </div>
                        <button id="btn_close">X</button>
                    </dialog>
                </div>
        </section>
    </main>
</body>
<footer class="footer_wrapper">
    <div class="content_footer">
        <div class="footer_top">
            <div id="logo">
                <img src="Icons/DA.png" alt="DA_Logo">
            </div>
            <div id="logo_titel">
                <h3> Developer Akademie</h3>
            </div>
        </div>
        <div id="footer_bottom">
            <div id="logo_titel">
                <h3>© 2023 Developer Akademie GmbH</h3>
            </div>
        </div>

    </div>

</footer>
<link rel="stylesheet" href="style.css" />
<script src="fotogram.js" defer></script>

</html>
